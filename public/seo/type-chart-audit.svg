<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 320"><title id="title">A directional audit of 153 distinct Pokémon type pairs</title><desc id="desc">There are 153 unordered pairs among 18 different types: 75 pairs have different type effectiveness values in the two directions and 78 have equal values. Calculated from TypeMatchup local defensive chart.</desc><rect width="960" height="320" fill="#f8fafc"/><text x="48" y="55" fill="#0f172a" font-family="Arial,sans-serif" font-size="28" font-weight="700">18 types • 153 distinct type pairs</text><text x="48" y="93" fill="#475569" font-family="Arial,sans-serif" font-size="17">Each pair checked twice: A attacks B, then B attacks A.</text><rect x="48" y="131" width="424" height="86" rx="12" fill="#1d4ed8"/><rect x="472" y="131" width="440" height="86" rx="12" fill="#0f766e"/><text x="82" y="169" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="800">75 pairs</text><text x="82" y="198" fill="#eff6ff" font-family="Arial,sans-serif" font-size="17">different when reversed</text><text x="505" y="169" fill="#fff" font-family="Arial,sans-serif" font-size="32" font-weight="800">78 pairs</text><text x="505" y="198" fill="#ccfbf1" font-family="Arial,sans-serif" font-size="17">same in both directions</text><text x="48" y="260" fill="#334155" font-family="Arial,sans-serif" font-size="17">Method: 18 × 17 ÷ 2. Main-series base type multipliers only.</text><text x="48" y="292" fill="#64748b" font-family="Arial,sans-serif" font-size="14">Source: TypeMatchup defensiveTypeChart.json • typematchup.org</text></svg>
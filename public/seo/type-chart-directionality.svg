<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 410"><title id="title">The Pokémon type chart is directional</title><desc id="desc">Ground moves against pure Electric defenders deal double damage, while Electric moves against Ground defenders do no damage.</desc><rect width="960" height="410" fill="#f8fafc"/><text x="48" y="53" fill="#0f172a" font-family="Arial,sans-serif" font-size="28" font-weight="700">The arrow matters: attacking move → defender</text><text x="48" y="90" fill="#475569" font-family="Arial,sans-serif" font-size="17">Same two types. Two different matchups. Current main-series chart.</text><rect x="40" y="120" width="880" height="118" rx="16" fill="#eff6ff" stroke="#93c5fd"/><rect x="40" y="259" width="880" height="118" rx="16" fill="#fff7ed" stroke="#fdba74"/><text x="72" y="164" fill="#1d4ed8" font-family="Arial,sans-serif" font-size="22" font-weight="700">GROUND move</text><text x="265" y="165" fill="#334155" font-family="Arial,sans-serif" font-size="28">→</text><text x="332" y="164" fill="#1e293b" font-family="Arial,sans-serif" font-size="22">ELECTRIC defender</text><text x="752" y="165" fill="#166534" font-family="Arial,sans-serif" font-size="34" font-weight="800">2×</text><text x="72" y="204" fill="#475569" font-family="Arial,sans-serif" font-size="17">Ground is super effective against Electric</text><text x="72" y="303" fill="#9a3412" font-family="Arial,sans-serif" font-size="22" font-weight="700">ELECTRIC move</text><text x="265" y="304" fill="#334155" font-family="Arial,sans-serif" font-size="28">→</text><text x="332" y="303" fill="#1e293b" font-family="Arial,sans-serif" font-size="22">GROUND defender</text><text x="752" y="304" fill="#b91c1c" font-family="Arial,sans-serif" font-size="34" font-weight="800">0×</text><text x="72" y="343" fill="#475569" font-family="Arial,sans-serif" font-size="17">Ground is immune to Electric moves</text><text x="48" y="397" fill="#64748b" font-family="Arial,sans-serif" font-size="14">TypeMatchup • Original chart reading guide • typematchup.org</text></svg>
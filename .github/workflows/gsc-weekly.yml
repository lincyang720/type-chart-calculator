name: Append GSC weekly SEO review

on:
  # Thursday 09:17 Asia/Taipei (01:17 UTC) allows time for prior Sunday's finalized GSC data.
  schedule:
    - cron: '17 1 * * 4'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gsc-weekly-review-main
  cancel-in-progress: false

jobs:
  append-review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only Google auth client
        run: python -m pip install "google-auth>=2.30,<3" "requests>=2.31,<3"
      - name: Verify report rendering without external data
        run: python -m unittest discover -s tests -p 'test_gsc_weekly.py' -v
      - name: Check GSC credential configuration
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing GSC_SERVICE_ACCOUNT_JSON Actions secret; see operations/gsc-weekly-setup.md. No report was written."
            exit 1
          fi
      - name: Fetch finalized Search Console data and append review
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: https://www.typematchup.org/
        run: python scripts/gsc_weekly.py
      - name: Commit only the generated weekly review if changed
        run: |
          if git diff --quiet -- operations/weekly-reviews.md; then
            echo "No new complete weekly period; file unchanged."
            exit 0
          fi
          git add -- operations/weekly-reviews.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "docs(ops): append finalized GSC weekly review"
          git push origin HEAD:main

name: Validate site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check dataset exports match the type chart
        run: python3 dataset/generate.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: SEO guardrails
        run: npm run check:seo
      - name: CMP consent regression checks
        run: npm run check:consent
      - name: AdSense native tag checks
        run: npm run check:adsense
      - name: CMP diagnostic guardrails
        run: npm run check:cmp-diagnostic
      - name: Verify original directional chart statistics
        run: npm run check:type-direction
      - name: Verify Ghost weakness data and page scope
        run: npm run check:ghost-weakness
      - name: Production build
        run: npm run build

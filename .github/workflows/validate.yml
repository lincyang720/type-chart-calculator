name: Validate site

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: SEO guardrails
        run: npm run check:seo
      - name: Production build
        run: npm run build

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Pokemon Type Chart Calculator</title>
  <desc id="desc">Pokemon type calculator, type chart calculator, and type effectiveness calculator preview.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff6ff"/>
      <stop offset=".52" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="brand" x1="130" y1="120" x2="1040" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563eb"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1f2937" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="74" y="64" width="1052" height="502" rx="30" fill="#fff" filter="url(#shadow)"/>
  <rect x="104" y="96" width="460" height="438" rx="22" fill="url(#brand)"/>
  <text x="142" y="174" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">Pokemon</text>
  <text x="142" y="238" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Type Chart</text>
  <text x="142" y="302" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800">Calculator</text>
  <text x="142" y="372" fill="#dbeafe" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Weaknesses • Resistances • Immunities</text>
  <g transform="translate(640 118)">
    <rect width="380" height="70" rx="14" fill="#f97316"/>
    <text x="190" y="46" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Fire</text>
    <rect y="92" width="380" height="70" rx="14" fill="#8b5cf6"/>
    <text x="190" y="138" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">Flying</text>
    <path d="M190 184v52" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
    <path d="M158 218l32 32 32-32" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect y="280" width="380" height="76" rx="16" fill="#fee2e2"/>
    <text x="190" y="328" text-anchor="middle" fill="#b91c1c" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="800">4x weak to Rock</text>
    <rect y="378" width="180" height="58" rx="14" fill="#dcfce7"/>
    <text x="90" y="415" text-anchor="middle" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">0.5x resist</text>
    <rect x="200" y="378" width="180" height="58" rx="14" fill="#e0e7ff"/>
    <text x="290" y="415" text-anchor="middle" fill="#3730a3" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800">0x immune</text>
  </g>
</svg>
